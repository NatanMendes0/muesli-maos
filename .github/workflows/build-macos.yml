name: Build macOS Release

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install whisper.cpp
        run: brew install whisper-cpp

      - name: Run Tests
        run: swift test

      - name: Build App
        run: make app

      - name: Package
        run: |
          cd build
          zip -r Muesli-macOS.zip Muesli.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muesli-macOS
          path: build/Muesli-macOS.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Muesli-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
